name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: |
          node --check functions/chess-engine.js
          node --check functions/chess-logic.js
          node --check functions/index.js
          node --check functions/whot-logic.js
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --node-modules-dir=none supabase/functions/cj-backend/index.ts
          deno check --node-modules-dir=none supabase/functions/clear-all-data/index.ts
